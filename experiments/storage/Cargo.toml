[package]
name = "learningos-storage-experiment"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rusqlite = { version = "=0.41.0", features = ["bundled"] }
turso = { version = "=0.8.3", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
debug = 0
