[package]
name = "learningos-browser-journal-experiment"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "=0.3.106", features = ["Window", "IdbFactory", "IdbDatabase", "IdbRequest", "IdbOpenDbRequest", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "IdbTransactionOptions", "IdbTransactionDurability", "DomException", "Event", "EventTarget", "DomStringList", "IdbKeyRange"] }
