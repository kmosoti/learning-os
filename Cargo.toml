[workspace]
resolver = "3"
members = ["crates/domain", "crates/application", "crates/protocol", "apps/server", "apps/web"]
exclude = ["experiments/storage", "experiments/storage/browser-rust"]
[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
[workspace.dependencies]
learningos-domain = { path = "crates/domain" }
learningos-application = { path = "crates/application" }
learningos-protocol = { path = "crates/protocol" }
learningos-web = { path = "apps/web", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
leptos = { version = "=0.8.22", default-features = false, features = ["islands"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
[profile.release]
lto = "thin"
codegen-units = 1
[profile.wasm-release]
inherits = "release"
opt-level = "s"
